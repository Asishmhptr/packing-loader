<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a43">
<title>Packing Loader</title>
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --ink:#14202e; --mute:#64748b; --line:#e2e8f0;
  --brand:#0f2a43; --accent:#1d6fd6; --ok:#12805c; --okbg:#e3f6ee; --warn:#b45309; --warnbg:#fef3c7; --bad:#c0392b;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b141d; --card:#132230; --ink:#e8eef5; --mute:#8fa3b8; --line:#23374a; --brand:#0a1a2a; --accent:#5aa2f5; --ok:#3ccf98; --okbg:#0f3327; --warn:#f0b04a; --warnbg:#3a2a0c;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hdr{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px}
.hdr .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hdr h1{font-size:17px;margin:0}
.hdr .who{font-size:12px;opacity:.8}
.hdr button.lo{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
.nav{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.nav button{flex:none;background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:999px;padding:7px 14px;font-size:14px}
.nav button.on{background:#fff;color:var(--brand);font-weight:600}
main{padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 40px);max-width:820px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:10px;padding:3px;margin-bottom:8px}
.seg button{border:0;background:none;padding:9px;border-radius:8px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
input[type=search],input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea{min-height:130px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.veh{padding:0;overflow:hidden}
.veh.done{border-color:var(--ok)}
.vh{display:flex;align-items:center;gap:10px;padding:12px}
.vh .t{flex:1;min-width:0;cursor:pointer}
.vh .no{font-weight:700;font-size:17px;letter-spacing:.3px}
.vh .sub{font-size:13px;color:var(--mute)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--warnbg);color:var(--warn);font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--line);color:var(--mute);margin-left:4px}
.chk{width:34px;height:34px;flex:none;border-radius:9px;border:2px solid var(--mute);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.part{background:var(--warn);border-color:var(--warn)}
.chk:disabled{opacity:.45}
.bl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.bl.loaded{background:var(--okbg)}
.bl .m{flex:1;min-width:0}.bl .b{font-weight:600}
.bl .s{font-size:12px;color:var(--mute)}
.more{display:block;width:100%;padding:12px;border:1px dashed var(--mute);background:none;border-radius:10px;color:var(--mute)}
.btn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:11px 16px;font-weight:600}
.btn.ghost{background:var(--line);color:var(--ink)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.urow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.role{font-size:11px;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--line)}
.role.admin{background:#e9d5ff;color:#6b21a8}.role.user{background:var(--okbg);color:var(--ok)}
.off{opacity:.55}
h2{font-size:16px;margin:4px 0 10px}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.login h1{font-size:22px;text-align:center;margin-bottom:4px}.login p{text-align:center;color:var(--mute);margin-top:0}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translate(-50%,30px);background:#111;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;font-size:14px}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--bad)}
dialog{border:0;border-radius:14px;padding:16px;width:min(420px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.log{font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
.log small{color:var(--mute)}
.muted{color:var(--mute);font-size:13px}

</style>
</head>
<body>
<div id="app"><p style="padding:20px;font-family:sans-serif">Loading… (if this stays, JavaScript is blocked in this browser)</p></div>
<div id="toast" role="status"></div>
<dialog id="dlg"></dialog>
<script>
// The address of your Cloudflare Worker (the API). No trailing slash.
window.APP_CONFIG = { API_BASE: "https://packing-loader.amohapatra.workers.dev" };

</script>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtT = (iso) => iso ? new Date(iso).toLocaleString("en-IN", { timeZone: "Asia/Kolkata", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", hour12: true }) : "";
const mt = (n) => (Math.round(n * 100) / 100).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const state = {
  me: null, rows: [], ticks: {}, view: "load",
  mode: "vehicle", q: "", plant: "all", status: "all", open: new Set(), limit: 40,
};
let byVehicle = new Map();

// ---------------------------------------------------------------- api / ui utils
const API_BASE = (window.APP_CONFIG && window.APP_CONFIG.API_BASE || "").replace(/\/+$/, "");
const getTok = () => { try { return localStorage.getItem("pl_token") || ""; } catch { return ""; } };
const setTok = (t) => { try { t ? localStorage.setItem("pl_token", t) : localStorage.removeItem("pl_token"); } catch {} };

async function api(path, { method = "GET", body } = {}) {
  const headers = {};
  if (body) headers["Content-Type"] = "application/json";
  if (getTok()) headers["Authorization"] = "Bearer " + getTok();
  let r;
  try {
    r = await fetch(API_BASE + "/api" + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  } catch { throw new Error("Cannot reach the server. Check your internet connection."); }
  let data = {};
  try { data = await r.json(); } catch {}
  if (r.status === 401 && path !== "/login") { setTok(""); state.me = null; render(); throw new Error("Session expired - please sign in"); }
  if (!r.ok) throw new Error(data.error || "Error " + r.status);
  return data;
}
let toastT;
function toast(msg, bad) {
  const t = $("#toast");
  t.textContent = msg; t.className = "show" + (bad ? " bad" : "");
  clearTimeout(toastT); toastT = setTimeout(() => (t.className = ""), 2600);
}
function dialog(html) {
  const d = $("#dlg"); d.innerHTML = html; d.showModal(); return d;
}
const canTick = () => state.me && (state.me.role === "user" || state.me.role === "admin");
const isAdmin = () => state.me && state.me.role === "admin";

// ---------------------------------------------------------------- boot / login
async function boot() {
  if (getTok()) { try { state.me = (await api("/me")).user; await loadData(); } catch { state.me = null; } }
  render();
}
async function loadData() {
  const d = await api("/data");
  state.rows = d.rows; state.ticks = d.ticks;
  byVehicle = new Map();
  for (const r of state.rows) { if (!byVehicle.has(r.vehicle)) byVehicle.set(r.vehicle, []); byVehicle.get(r.vehicle).push(r); }
}

function render() {
  const app = $("#app");
  if (!state.me) return renderLogin(app);
  const tabs = [["load", "Loading"]];
  if (isAdmin()) tabs.push(["data", "Packing data"], ["users", "Users"], ["log", "Activity"]);
  app.innerHTML = `
    <div class="hdr">
      <div class="row"><div><h1>Packing Loader</h1><div class="who">${esc(state.me.name)} · ${esc(state.me.role)}</div></div>
      <div><button class="lo" id="refresh">Refresh</button> <button class="lo" id="logout">Sign out</button></div></div>
      ${tabs.length > 1 ? `<div class="nav">${tabs.map(([k, l]) => `<button data-view="${k}" class="${state.view === k ? "on" : ""}">${l}</button>`).join("")}</div>` : ""}
    </div>
    <main id="main"></main>`;
  $("#logout").onclick = async () => { try { await api("/logout", { method: "POST" }); } catch {} setTok(""); state.me = null; render(); };
  $("#refresh").onclick = async () => { try { await loadData(); renderView(); toast("Updated"); } catch (e) { toast(e.message, true); } };
  app.querySelectorAll(".nav button").forEach((b) => (b.onclick = () => { state.view = b.dataset.view; render(); }));
  renderView();
}
function renderView() {
  ({ load: viewLoad, data: viewData, users: viewUsers, log: viewLog }[state.view] || viewLoad)();
}

function renderLogin(app) {
  app.innerHTML = `
    <div class="login">
      <h1>Packing Loader</h1><p>Sign in to continue</p>
      <div class="card">
        <label>Username</label><input id="u" type="text" autocapitalize="none" autocomplete="username">
        <label>Password</label>
        <div style="display:flex;gap:6px"><input id="p" type="password" name="password" autocomplete="off" style="flex:1"><button class="btn ghost" id="sp" type="button" style="flex:none">Show</button></div>
        <div class="err" id="err"></div>
        <button class="btn" id="go" style="width:100%">Sign in</button>
      </div>
      <p class="muted" style="margin-top:14px">v4</p>
    </div>`;
  $("#sp").onclick = () => { const p = $("#p"), show = p.type === "password"; p.type = show ? "text" : "password"; $("#sp").textContent = show ? "Hide" : "Show"; p.focus(); };
  const go = async () => {
    $("#err").textContent = ""; $("#go").disabled = true;
    try {
      const res = await api("/login", { method: "POST", body: { username: $("#u").value, password: $("#p").value } });
      setTok(res.token); state.me = res.user;
      state.view = "load"; await loadData(); render();
    } catch (e) { $("#err").textContent = e.message; $("#go").disabled = false; }
  };
  $("#go").onclick = go;
  $("#p").onkeydown = (e) => e.key === "Enter" && go();
}

// ---------------------------------------------------------------- loading view
function overall() {
  let n = 0, w = 0, tw = 0, vDone = 0;
  for (const r of state.rows) { tw += r.net; if (state.ticks[r.batch]) { n++; w += r.net; } }
  for (const [, list] of byVehicle) if (list.every((r) => state.ticks[r.batch])) vDone++;
  return { n, total: state.rows.length, w, tw, vDone, vTotal: byVehicle.size };
}

function viewLoad() {
  const plants = [...new Set(state.rows.map((r) => r.plant))].sort();
  $("#main").innerHTML = `
    <div id="stats"></div>
    <div class="seg"><button data-m="vehicle" class="${state.mode === "vehicle" ? "on" : ""}">By Vehicle</button><button data-m="batch" class="${state.mode === "batch" ? "on" : ""}">By Batch</button></div>
    <input id="q" type="search" placeholder="Search vehicle or batch no" value="${esc(state.q)}" autocapitalize="characters">
    <div class="chips" id="cp">${["all", ...plants].map((p) => `<button class="chip ${state.plant === p ? "on" : ""}" data-p="${esc(p)}">${p === "all" ? "All plants" : "Plant " + esc(p)}</button>`).join("")}</div>
    <div class="chips" id="cs">${[["all", "All"], ["pending", "Pending"], ["loaded", "Loaded"]].map(([k, l]) => `<button class="chip ${state.status === k ? "on" : ""}" data-s="${k}">${l}</button>`).join("")}</div>
    ${canTick() ? "" : `<div class="card muted">View-only access - you can see status but not tick.</div>`}
    <div id="list"></div>`;
  $("#main").querySelectorAll(".seg button").forEach((b) => (b.onclick = () => { state.mode = b.dataset.m; state.limit = 40; viewLoad(); }));
  $("#q").oninput = (e) => { state.q = e.target.value.trim().toUpperCase(); state.limit = 40; renderList(); };
  $("#cp").onclick = (e) => { const b = e.target.closest("[data-p]"); if (b) { state.plant = b.dataset.p; state.limit = 40; viewLoad(); } };
  $("#cs").onclick = (e) => { const b = e.target.closest("[data-s]"); if (b) { state.status = b.dataset.s; state.limit = 40; viewLoad(); } };
  $("#list").onclick = onListClick;
  renderStats(); renderList();
}

function renderStats() {
  const o = overall();
  const el = $("#stats"); if (!el) return;
  const pct = o.total ? (o.n / o.total) * 100 : 0;
  el.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${o.n}/${o.total}</b><span>Batches loaded</span></div>
      <div class="stat"><b>${o.vDone}/${o.vTotal}</b><span>Vehicles complete</span></div>
      <div class="stat"><b>${mt(o.w)}</b><span>of ${mt(o.tw)} MT</span></div>
    </div><div class="bar"><i style="width:${pct}%"></i></div>`;
}

function rowMatches(r) {
  if (state.plant !== "all" && r.plant !== state.plant) return false;
  if (state.q && !(r.vehicle.includes(state.q) || r.batch.includes(state.q))) return false;
  return true;
}

function renderList() {
  const el = $("#list"); if (!el) return;
  const dis = canTick() ? "" : "disabled";
  let html = "", shown = 0, total = 0;

  if (state.mode === "vehicle") {
    const items = [];
    for (const [veh, list] of byVehicle) {
      if (!list.some(rowMatches)) continue;
      const done = list.filter((r) => state.ticks[r.batch]).length;
      if (state.status === "pending" && done === list.length) continue;
      if (state.status === "loaded" && done !== list.length) continue;
      items.push([veh, list, done]);
    }
    total = items.length;
    const auto = state.q && items.length <= 3;
    for (const [veh, list, done] of items.slice(0, state.limit)) {
      shown++;
      const all = done === list.length, open = auto || state.open.has(veh);
      const plants = [...new Set(list.map((r) => r.plant))];
      html += `<div class="card veh ${all ? "done" : ""}">
        <div class="vh">
          <div class="t" data-toggle="${esc(veh)}">
            <div class="no">${esc(veh)} ${plants.map((p) => `<span class="tag">${esc(p)}</span>`).join("")}</div>
            <div class="sub"><span class="pill ${all ? "ok" : ""}">${done}/${list.length} loaded</span> · ${mt(list.reduce((a, r) => a + r.net, 0))} MT ${open ? "▴" : "▾"}</div>
          </div>
          <button class="chk ${all ? "on" : done ? "part" : ""}" ${dis} data-veh="${esc(veh)}" aria-label="Load all batches of ${esc(veh)}">${all ? "✓" : done ? "–" : ""}</button>
        </div>
        ${open ? list.map(batchRow).join("") : ""}
      </div>`;
    }
  } else {
    const items = state.rows.filter((r) => {
      if (!rowMatches(r)) return false;
      const t = !!state.ticks[r.batch];
      return state.status === "all" || (state.status === "loaded") === t;
    });
    total = items.length;
    const slice = items.slice(0, state.limit); shown = slice.length;
    html = `<div class="card veh">${slice.map((r) => batchRow(r, true)).join("")}</div>`;
    if (!slice.length) html = "";
  }
  if (!shown) html = `<div class="card muted">Nothing matches.</div>`;
  if (shown < total) html += `<button class="more" data-more>Show more (${total - shown} left)</button>`;
  el.innerHTML = html;
  el.querySelectorAll(".chk[data-batch]").forEach((b) => (b.disabled = !canTick()));
}

function batchRow(r, showVeh) {
  const t = state.ticks[r.batch];
  return `<div class="bl ${t ? "loaded" : ""}">
    <button class="chk ${t ? "on" : ""}" ${canTick() ? "" : "disabled"} data-batch="${esc(r.batch)}" aria-label="Load batch ${esc(r.batch)}">${t ? "✓" : ""}</button>
    <div class="m"><div class="b">${esc(r.batch)} <span class="tag">${esc(r.plant)}</span></div>
    <div class="s">${showVeh ? esc(r.vehicle) + " · " : ""}${mt(r.net)} MT${t ? ` · ✓ ${esc(t.name || t.by)} · ${fmtT(t.at)}` : ""}</div></div>
  </div>`;
}

function onListClick(e) {
  if (e.target.closest("[data-more]")) { state.limit += 40; return renderList(); }
  const tg = e.target.closest("[data-toggle]");
  if (tg) { const v = tg.dataset.toggle; state.open.has(v) ? state.open.delete(v) : state.open.add(v); return renderList(); }
  const bb = e.target.closest("[data-batch]");
  if (bb && !bb.disabled) {
    const b = bb.dataset.batch, r = state.rows.find((x) => x.batch === b);
    return setLoaded([b], !state.ticks[b], r && r.vehicle);
  }
  const vb = e.target.closest("[data-veh]");
  if (vb && !vb.disabled) {
    const v = vb.dataset.veh, list = byVehicle.get(v);
    const pending = list.filter((r) => !state.ticks[r.batch]).map((r) => r.batch);
    if (pending.length) return setLoaded(pending, true, v);
    if (confirm(`Un-tick all ${list.length} batches of ${v}?`)) setLoaded(list.map((r) => r.batch), false, v);
  }
}

async function setLoaded(batches, loaded, vehicle) {
  const prev = batches.map((b) => [b, state.ticks[b]]);
  const at = new Date().toISOString();
  for (const b of batches) loaded ? (state.ticks[b] = { by: state.me.username, name: state.me.name, at }) : delete state.ticks[b];
  renderStats(); renderList();
  try {
    await api("/tick", { method: "POST", body: { batches, loaded, vehicle } });
  } catch (e) {
    for (const [b, t] of prev) t ? (state.ticks[b] = t) : delete state.ticks[b];
    renderStats(); renderList(); toast(e.message, true);
  }
}

// ---------------------------------------------------------------- admin: packing data
function viewData() {
  $("#main").innerHTML = `
    <div class="card"><h2>Add a single row</h2>
      <div class="grid2"><div><label>Desp plant</label><input id="a_plant" type="text" inputmode="numeric"></div>
      <div><label>Vehicle no</label><input id="a_veh" type="text" autocapitalize="characters"></div></div>
      <label>Batch no</label><input id="a_batch" type="text" autocapitalize="characters">
      <div class="grid2"><div><label>Net wt (MT)</label><input id="a_net" type="number" step="0.001" inputmode="decimal"></div>
      <div><label>Gross wt (MT) <span class="muted">(blank = net)</span></label><input id="a_gross" type="number" step="0.001" inputmode="decimal"></div></div>
      <div class="btns"><button class="btn" id="a_add">Add row</button></div>
    </div>
    <div class="card"><h2>Bulk add (paste from Excel)</h2>
      <div class="muted">Columns in order: <b>SL NO, DESP PLANT, BATCH NO, NET WT, GROSS WT, VEHICLE NO</b> (SL NO optional, header row optional). New batches are appended; existing batch numbers are skipped.</div>
      <textarea id="bulk" placeholder="733&#9;26D5408C07&#9;22.6&#9;22.6&#9;OD14AJ4549"></textarea>
      <div class="btns"><button class="btn" id="b_add">Add pasted rows</button></div><div id="b_res" class="muted" style="margin-top:8px"></div>
    </div>
    <div class="card"><h2>Edit / delete rows</h2>
      <input id="e_q" type="search" placeholder="Search batch or vehicle" autocapitalize="characters"><div id="e_list" style="margin-top:8px"></div></div>
    <div class="card"><h2>Export</h2><div class="muted">Full packing list with loaded status, who ticked and when.</div>
      <div class="btns"><button class="btn ghost" id="exp">Download CSV</button></div></div>`;

  $("#a_add").onclick = async () => {
    const row = { plant: $("#a_plant").value, vehicle: $("#a_veh").value, batch: $("#a_batch").value, net: $("#a_net").value, gross: $("#a_gross").value };
    try {
      const r = await api("/rows/add", { method: "POST", body: { rows: [row] } });
      if (r.added) { toast("Row added"); ["a_batch", "a_net", "a_gross"].forEach((i) => ($("#" + i).value = "")); await loadData(); }
      else toast(r.duplicates.length ? "Batch already exists" : "Invalid: " + (r.errors[0]?.reason || ""), true);
    } catch (e) { toast(e.message, true); }
  };
  $("#b_add").onclick = async () => {
    const rows = parsePaste($("#bulk").value);
    if (!rows.length) return toast("Nothing to add", true);
    try {
      const r = await api("/rows/add", { method: "POST", body: { rows } });
      $("#b_res").innerHTML = `Added <b>${r.added}</b>` + (r.duplicates.length ? ` · skipped ${r.duplicates.length} duplicate(s)` : "") + (r.errors.length ? ` · ${r.errors.length} invalid (line ${r.errors.slice(0, 5).map((x) => x.line + ": " + x.reason).join("; ")})` : "");
      if (r.added) { $("#bulk").value = ""; await loadData(); }
    } catch (e) { toast(e.message, true); }
  };
  const drawEdit = () => {
    const q = $("#e_q").value.trim().toUpperCase();
    const list = q ? state.rows.filter((r) => r.batch.includes(q) || r.vehicle.includes(q)).slice(0, 30) : [];
    $("#e_list").innerHTML = q ? (list.map((r) => `<div class="log urow"><div><b>${esc(r.batch)}</b> <span class="tag">${esc(r.plant)}</span><br><small>${esc(r.vehicle)} · ${mt(r.net)} MT</small></div><button class="btn ghost sm" data-edit="${esc(r.batch)}">Edit</button></div>`).join("") || `<div class="muted">No match.</div>`) : `<div class="muted">Type to search.</div>`;
  };
  $("#e_q").oninput = drawEdit; drawEdit();
  $("#e_list").onclick = (e) => { const b = e.target.closest("[data-edit]"); if (b) editRowDialog(b.dataset.edit); };
  $("#exp").onclick = exportCsv;
}

function parsePaste(text) {
  const out = [];
  for (const line of text.split(/\r?\n/)) {
    if (!line.trim()) continue;
    let c = line.includes("\t") ? line.split("\t") : line.split(",");
    c = c.map((x) => x.trim());
    if (c.length >= 6) c = c.slice(1);           // drop SL NO
    if (c.length < 5) { out.push({ plant: "", batch: c[1] }); continue; }
    if (isNaN(parseFloat(c[2]))) continue;       // header row
    out.push({ plant: c[0], batch: c[1], net: c[2], gross: c[3], vehicle: c[4] });
  }
  return out;
}

function editRowDialog(batch) {
  const r = state.rows.find((x) => x.batch === batch); if (!r) return;
  const d = dialog(`<h2>Edit ${esc(r.batch)}</h2>
    <label>Desp plant</label><input id="x_plant" type="text" value="${esc(r.plant)}">
    <label>Vehicle no</label><input id="x_veh" type="text" value="${esc(r.vehicle)}" autocapitalize="characters">
    <div class="grid2"><div><label>Net wt</label><input id="x_net" type="number" step="0.001" value="${r.net}"></div><div><label>Gross wt</label><input id="x_gross" type="number" step="0.001" value="${r.gross}"></div></div>
    <div class="btns"><button class="btn" id="x_save">Save</button><button class="btn danger" id="x_del">Delete row</button><button class="btn ghost" id="x_cancel">Cancel</button></div>`);
  $("#x_cancel").onclick = () => d.close();
  $("#x_save").onclick = async () => {
    try {
      await api("/rows/update", { method: "POST", body: { batch, row: { plant: $("#x_plant").value, vehicle: $("#x_veh").value, net: $("#x_net").value, gross: $("#x_gross").value } } });
      d.close(); toast("Saved"); await loadData(); viewData();
    } catch (e) { toast(e.message, true); }
  };
  $("#x_del").onclick = async () => {
    if (!confirm(`Delete batch ${batch}? Its tick will be removed too.`)) return;
    try { await api("/rows/delete", { method: "POST", body: { batches: [batch] } }); d.close(); toast("Deleted"); await loadData(); viewData(); }
    catch (e) { toast(e.message, true); }
  };
}

function exportCsv() {
  const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [["SL NO", "DESP PLANT", "BATCH NO", "NET WT (MT)", "GROSS WT (MT)", "VEHICLE NO", "LOADED", "LOADED BY", "LOADED AT (IST)"].map(q).join(",")];
  for (const r of state.rows) {
    const t = state.ticks[r.batch];
    lines.push([r.sl, r.plant, r.batch, r.net, r.gross, r.vehicle, t ? "YES" : "NO", t ? t.name || t.by : "", t ? fmtT(t.at) : ""].map(q).join(","));
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
  a.download = "packing_status_" + new Date().toISOString().slice(0, 10) + ".csv"; a.click();
}

// ---------------------------------------------------------------- admin: users
async function viewUsers() {
  $("#main").innerHTML = `<div class="btns" style="margin:0 0 10px"><button class="btn" id="nu">+ Add user</button></div><div id="ul" class="muted">Loading…</div>
    <div class="muted" style="margin-top:8px"><b>Viewer</b>: see only · <b>User</b>: can tick loads · <b>Admin</b>: everything</div>`;
  $("#nu").onclick = () => userDialog();
  try {
    const { users } = await api("/users");
    $("#ul").innerHTML = users.map((u) => `<div class="card urow ${u.active ? "" : "off"}">
      <div><b>${esc(u.name)}</b> <span class="role ${esc(u.role)}">${esc(u.role)}</span>${u.active ? "" : ' <span class="tag">disabled</span>'}<br><small class="muted">${esc(u.username)}${u.builtin ? " · built-in" : ""}</small></div>
      ${u.builtin ? "" : `<button class="btn ghost sm" data-u="${esc(u.username)}">Edit</button>`}</div>`).join("");
    $("#ul").className = "";
    $("#ul").onclick = (e) => { const b = e.target.closest("[data-u]"); if (b) userDialog(users.find((x) => x.username === b.dataset.u)); };
  } catch (e) { $("#ul").textContent = e.message; }
}

function userDialog(u) {
  const edit = !!u;
  const d = dialog(`<h2>${edit ? "Edit user" : "Add user"}</h2>
    <label>Username</label><input id="f_u" type="text" autocapitalize="none" value="${esc(u?.username || "")}" ${edit ? "disabled" : ""}>
    <label>Full name</label><input id="f_n" type="text" value="${esc(u?.name || "")}">
    <label>Role</label><select id="f_r">${["viewer", "user", "admin"].map((r) => `<option ${u?.role === r || (!u && r === "user") ? "selected" : ""}>${r}</option>`).join("")}</select>
    <label>${edit ? "New password (leave blank to keep)" : "Password (min 6)"}</label><input id="f_p" type="text" autocomplete="off">
    ${edit ? `<label><input type="checkbox" id="f_a" ${u.active ? "checked" : ""} style="width:auto"> Active</label>` : ""}
    <div class="btns"><button class="btn" id="f_save">Save</button>${edit ? '<button class="btn danger" id="f_del">Delete</button>' : ""}<button class="btn ghost" id="f_cancel">Cancel</button></div>`);
  $("#f_cancel").onclick = () => d.close();
  $("#f_save").onclick = async () => {
    try {
      if (edit) {
        const b = { name: $("#f_n").value, role: $("#f_r").value, active: $("#f_a").checked };
        if ($("#f_p").value) b.password = $("#f_p").value;
        await api("/users/" + u.username, { method: "PUT", body: b });
      } else {
        await api("/users", { method: "POST", body: { username: $("#f_u").value, name: $("#f_n").value, role: $("#f_r").value, password: $("#f_p").value } });
      }
      d.close(); toast("Saved"); viewUsers();
    } catch (e) { toast(e.message, true); }
  };
  if (edit) $("#f_del").onclick = async () => {
    if (!confirm(`Delete ${u.username}?`)) return;
    try { await api("/users/" + u.username, { method: "DELETE" }); d.close(); toast("Deleted"); viewUsers(); } catch (e) { toast(e.message, true); }
  };
}

// ---------------------------------------------------------------- admin: activity log
const ACT = { load: "Loaded", unload: "Un-ticked", "user.create": "Created user", "user.update": "Updated user", "user.delete": "Deleted user", "rows.add": "Added rows", "rows.update": "Edited row", "rows.delete": "Deleted rows" };
async function viewLog() {
  $("#main").innerHTML = `<div id="lg" class="muted">Loading…</div>`;
  try {
    const { entries } = await api("/log");
    $("#lg").className = "";
    $("#lg").innerHTML = entries.length ? `<div class="card">${entries.map((e) => `<div class="log"><b>${esc(e.name || e.by)}</b> ${esc(ACT[e.action] || e.action)}
      ${e.vehicle ? `<b>${esc(e.vehicle)}</b> ` : ""}${e.target ? `<b>${esc(e.target)}</b> ` : ""}${e.n ? `(${e.n} batch${e.n > 1 ? "es" : ""}: ${esc((e.batches || []).join(", "))}${e.n > (e.batches || []).length ? "…" : ""})` : ""}
      <br><small>${fmtT(e.at)}</small></div>`).join("")}</div>` : `<div class="card muted">No activity yet.</div>`;
  } catch (e) { $("#lg").textContent = e.message; }
}

boot();
